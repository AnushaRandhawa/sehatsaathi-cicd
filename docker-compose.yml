services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sehat
      POSTGRES_PASSWORD: sehat_local_pw
      POSTGRES_DB: sehatsaathi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  patient:
    build: ./services/patient
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://sehat:sehat_local_pw@db:5432/sehatsaathi
    depends_on:
      - db

  scheduling:
    build: ./services/scheduling
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://sehat:sehat_local_pw@db:5432/sehatsaathi
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  queue:
    build: ./services/queue
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://sehat:sehat_local_pw@db:5432/sehatsaathi
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  publisher:
    build: ./services/publisher
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sehat:sehat_local_pw@db:5432/sehatsaathi
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    depends_on:
      - db

volumes:
  pgdata: